
sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações
    # database: dev -- É O CATÁLOGO, MAS JÁ ESTA PADRONIZADO NAS CONFIGS DO PROJETO.
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades, com dados na granularidade de cidades e estados.
      - name: clientes
        description: Tabela fonte de clientes, com dados pessoais de cada cliente da Banvic.